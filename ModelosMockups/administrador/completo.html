tbody tr:focus-within{background:#edf8f2;outline:2px solid #b5dfc7;outline-offset:-2px}tbody tr{transition:.15s}.pill{display:inline-flex;padding:5px 8px;border-radius:99px;font-weight:800;font-size:10px}.ok{background:var(--green2);color:var(--green)}.info{background:var(--blue2);color:var(--blue)}.warn{background:#fff2ce;color:#916a06}.bad{background:var(--red2);color:var(--red)}.pager{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px;color:var(--muted);font-size:11px}.pages{display:flex;gap:4px;align-items:center}.pages button{min-width:31px;height:31px;border:1px solid var(--line);background:#fff;border-radius:6px;color:var(--ink);font-size:11px}.pages button.active{background:var(--green);border-color:var(--green);color:#fff}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.module-card{padding:18px;background:#fff;border:1px solid var(--line);border-radius:11px}.module-card h3{font-size:15px;margin:0 0 7px}.module-card p{font-size:12px;color:var(--muted);line-height:1.5;margin:0 0 15px}.bar{height:8px;background:#e8efeb;border-radius:5px;overflow:hidden}.bar span{display:block;height:100%;background:var(--green);border-radius:5px}.empty{text-align:center;color:var(--muted);padding:35px 15px;font-size:13px}.modal-back{position:fixed;z-index:5;inset:0;background:#17212b55;display:grid;place-items:center;padding:18px}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:14px;padding:25px;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;align-items:start}.modal h2{margin:0;font-size:20px}.close{border:0;background:#edf2ef;border-radius:7px;padding:6px 10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.checklist{display:grid;gap:9px;margin:18px 0}.check{display:flex;gap:9px;align-items:center;padding:11px;background:var(--paper);border-radius:8px;font-size:12px}.check input{accent-color:var(--green)}.no <body>
<section class="login" id="login"><div class="login-box"><div class="logo">NEW RICH<small>ADMINISTRACION</small></div><h1>Iniciar sesion</h1><p>Ingresa con tu cuenta de administrador para gestionar la operacion.</p><form onsubmit="login(event)"><div class="field"><label for="user">Usuario</label><input id="user" value="admin" autocomplete="username"></div><div class="field"><label for="pass">Contrasena</label><input id="pass" type="password" value="admin123" autocomplete="current-password"></div><div id="loginError" class="notice hidden">Usuario o contrasena incorrectos.</div><button class="primary">Ingresar</button></form><div class="hint">Acceso de demostracion: admin / admin123</div></div></section>
<div class="app hidden" id="app"><aside class="side"><div class="brand">NR<span>ADMINISTRACION</span></div><nav class="nav"><button class="active" data-view="resumen" onclick="showView(this)"><i>▦</i><span>Resumen</span></button><button data-view="usuarios" onclick="showView(this)"><i>◉</i><span>Usuarios</span></button><button data-view="pda" onclick="showView(this)"><i>▣</i><span>PDA</span></button><button data-view="loterias" onclick="showView(this)"><i>◇</i><span>Loterias</span></button><button data-view="resultados" onclick="showView(this)"><i>✦</i><span>Resultados</span></button><button data-view="ventas" onclick="showView(this)"><i>▤</i><span>Ventas</span></button><button data-view="offline" onclick="showView(this)"><i>↺</i><span>Ventas offline</span></button><button data-view="premios" onclick="showView(this)"><i>★</i><span>Casos de premios</span></button><button data-view="kpi" onclick="showView(this)"><i>◒</i><span>KPI</span></button><button data-view="notificaciones" onclick="showView(this)"><i>!</i><span>Notificaciones</span></button><button data-view="soporte" onclick="showView(this)"><i>□</i><span>Soporte</span></button><button data-view="configuracion" onclick="showView(this)"><i>⚙</i><span>Configuracion</span></button></nav><div class="side-foot">Servidor central<br><strong>Conectado</strong><br><br><button class="secondary" onclick="logout()">Cerrar sesion</button></div></aside><main><header class="top"><div class="crumb">New Rich / <strong id="crumb">Resumen</strong></div><div class="top-user"><b>Administrador principal</b><div class="avatar">AP</div></div></header><section class="content" id="content"></section></main><nav class="mobile-bar"><button class="active" data-view="resumen" onclick="showView(this)">Resumen</button><button data-view="usuarios" onclick="showView(this)">Usuarios</button><button data-view="ventas" onclick="showView(this)">Ventas</button><button data-view="soporte" onclick="showView(this)">Soporte</button></nav></div>
<div class="modal-back hidden" id="modalBack" onclick="closeModal(event)"><div class="modal" id="modal"></div></div>
<script>
const names={resumen:'Resumen',usuarios:'Usuarios',grupos:'Grupos',pda:'PDA',loterias:'Loterias',resultados:'Resultados',ventas:'Ventas',offline:'Ventas offline',premios:'Casos de premios',kpi:'KPI',notificaciones:'Notificaciones',soporte:'Soporte',configuracion:'Configuracion'};
const users=[['USR-001','Camila Rojas','Vendedor','PDA-042','Activo'],['USR-002','Jorge Mena','Vendedor','PDA-017','Activo'],['USR-003','Laura Gil','Observador','PDA-031','Activo'],['USR-004','Mateo Diaz','Vendedor','PDA-009','Inactivo'],['USR-005','Nora Castro','Vendedor','PDA-028','Bloqueado'],['USR-006','Andres Perez','Observador','PDA-015','Activo'],['USR-007','Sara Leon','Vendedor','PDA-054','Activo'],['USR-008','Diana Mora','Vendedor','PDA-061','Activo'],['USR-009','Felipe Ruiz','Vendedor','PDA-070','Activo'],['USR-010','Martha Gil','Observador','PDA-072','Activo'],['USR-011','Luis Vega','Vendedor','PDA-078','Inactivo'],['USR-012','Ana Rios','Vendedor','PDA-081','Activo'],['USR-013','Juan Lara','Vendedor','PDA-084','Activo'],['USR-014','Elena Paz','Observador','PDA-088','Activo'],['USR-015','Tomas Gil','Vendedor','PDA-091','Activo'],['USR-016','Rosa Diaz','Vendedor','PDA-095','Activo'],['USR-017','Pablo Mora','Vendedor','PDA-099','Activo']];
const sales=[['AOL-4839201','Camila Rojas','30/08/2026 14:32','$45.000','Jugado'],['AOL-4839198','Jorge Mena','30/08/2026 14:27','$12.000','Jugado'],['AOL-4839190','Laura Gil','30/08/2026 14:19','$80.000','Ganador'],['AOL-4839182','Mateo Diaz','30/08/2026 14:04','$25.000','Jugado'],['AOL-4839175','Nora Castro','30/08/2026 13:58','$10.000','Pagado'],['AOL-4839167','Camila Rojas','30/08/2026 13:41','$55.000','Jugado'],['AOL-4839159','Jorge Mena','30/08/2026 13:20','$18.000','Jugado'],['AOL-4839152','Laura Gil','30/08/2026 13:02','$30.000','Jugado'],['AOL-4839144','Mateo Diaz','30/08/2026 12:46','$22.000','Vencido'],['AOL-4839138','Nora Castro','30/08/2026 12:30','$40.000','Jugado'],['AOL-4839129','Camila Rojas','30/08/2026 12:08','$15.000','Jugado'],['AOL-4839112','Jorge Mena','30/08/2026 11:52','$26.000','Jugado'],['AOL-4839104','Laura Gil','30/08/2026 11:26','$19.000','Jugado'],['AOL-4839097','Mateo Diaz','30/08/2026 11:11','$31.000','Jugado'],['AOL-4839088','Nora Castro','30/08/2026 10:48','$17.000','Jugado'],['AOL-4839077','Sara Leon','30/08/2026 10:21','$14.000','Jugado']];
const lotteryCatalog=[{name:'Bogota',city:'Bogota',status:'Activo'},{name:'Medellin',city:'Medellin',status:'Activo'},{name:'Cali',city:'Cali',status:'Activo'},{name:'Armenia',city:'Armenia',status:'Activo'},{name:'Pasto',city:'Pasto',status:'Inactivo'}];
let current='resumen',page=1,activeData=[];
function login(e){e.preventDefault();if(document.getElementById('user').value==='admin'&&document.getElementById('pass').value==='admin123'){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');addHeaderControls();showView(document.querySelector('[data-view="resumen"]'))}else document.getElementById('loginError').classList.remove('hidden')}
function logout(){document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden')}
function showView(el){current=el.dataset.view;page=1;document.querySelectorAll('.nav button,.mobile-bar button').forEach(b=>b.classList.toggle('active',b.dataset.view===current));document.getElementById('crumb').textContent=names[current];render();if(current==='kpi')initializeKpiSellerFilter()}
function tag(s){let c=s==='Activo'||s==='Jugado'||s==='Pagado'||s==='Validado'?'ok':s==='Ganador'||s==='Pendiente'||s==='Reportado'?'warn':s==='Vencido'||s==='Bloqueado'||s==='Rechazado'?'bad':'info';return `<span class="pill ${c}">${s}</span>`}
function render(){const f={resumen:summary,usuarios:usersView,grupos:groupsView,pda:pdaView,loterias:lotteryView,resultados:resultsView,ventas:ventasView,offline:offlineView,premios:prizesView,kpi:kpiView,notificaciones:notificationsView,soporte:supportView,configuracion:configView};document.getElementById('content').innerHTML=f[current]();if(current==='usuarios')document.getElementById('content').insertAdjacentHTML('beforeend','<div class="panel"><div class="panel-head"><div><h2>Seguridad y acciones de usuario</h2><div class="panel-sub">Selecciona un usuario para habilitar las acciones administrativas.</div></div></div><div class="toolbar"><button id="resetUserButton" class="secondary" disabled onclick="openSelectedUserAction(\'Restablecer contraseña\')">Restablecer contraseña</button><button id="unlockUserButton" class="secondary" disabled onclick="openSelectedUserAction(\'Desbloquear usuario\')">Desbloquear usuario</button><button id="changeGroupButton" class="secondary" disabled onclick="openSelectedUserAction(\'Cambiar grupo\')">Cambiar grupo</button><button id="deleteUserButton" class="danger" disabled onclick="openSelectedUserAction(\'Eliminar usuario\')">Eliminar usuario</button></div></div>');if(current==='loterias')document.querySelectorAll('#content h2').forEach(title=>{if(title.textContent==='Buscar boletos vendidos')title.closest('.panel').remove()});if(current==='ventas'){const firstTable=document.querySelector('#content table');if(firstTable)firstTable.closest('.panel').insertAdjacentHTML('afterbegin',statusLegend())}}
function selectedUserIds(){return Array.from(document.querySelectorAll('.user-check:checked')).map(check=>check.value)}
function updateUserActions(){const enabled=selectedUserIds().length>0;['resetUserButton','unlockUserButton','changeGroupButton','deleteUserButton'].forEach(id=>{const button=document.getElementById(id);if(button)button.disabled=!enabled})}
function openSelectedUserAction(action){const selected=selectedUserIds();if(!selected.length){toast('Selecciona al menos un usuario para continuar');return}openAccessModal(action,selected.join(','))}
function statusLegend(){return '<div class="status-legend" aria-label="Significado de estados" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 14px;margin-bottom:14px;background:var(--paper);border:1px solid var(--line);border-radius:8px;font-size:11px;color:var(--muted)"><strong style="color:var(--ink)">Significado del estado:</strong><span><b style="color:var(--blue)">Jugado</b>: boleto registrado pendiente de resultado.</span><span><b style="color:#946a08">Ganador</b>: boleto ganador pendiente de pago.</span><span><b style="color:var(--green)">Pagado</b>: premio autorizado y pagado.</span><span><b style="color:var(--red)">Vencido</b>: supero la vigencia.</span><span><b style="color:var(--muted)">No ganador</b>: no coincide con el resultado.</span></div>'}
function initializeKpiSellerFilter(){const input=document.getElementById('kpiSeller');if(!input||input.dataset.enhanced)return;input.dataset.enhanced='true';const wrapper=document.createElement('div');wrapper.className='seller-dropdown';wrapper.style='position:relative';input.parentNode.insertBefore(wrapper,input);wrapper.appendChild(input);input.setAttribute('role','combobox');input.setAttribute('aria-autocomplete','list');input.setAttribute('aria-expanded','false');input.placeholder='Buscar una persona';const menu=document.createElement('div');menu.className='seller-options';menu.setAttribute('role','listbox');menu.style='display:none;position:absolute;z-index:4;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);max-height:190px;overflow:auto';wrapper.appendChild(menu);const sellers=users.filter(user=>user[2]==='Vendedor').map(user=>user[1]);function renderSellerOptions(){const query=input.value.toLowerCase().trim();const matches=sellers.filter(seller=>seller.toLowerCase().includes(query));menu.innerHTML=matches.length?matches.map(seller=>`<button type="button" role="option" style="display:block;width:100%;border:0;background:#fff;text-align:left;padding:10px 12px;font-size:12px" onmouseenter="this.style.background='var(--green2)'" onmouseleave="this.style.background='#fff'" onclick="selectKpiSeller('${seller}')">${seller}</button>`).join(''):'<div style="padding:10px 12px;color:var(--muted);font-size:12px">No se encontraron resultados</div>';menu.style.display='block';input.setAttribute('aria-expanded','true')}input.addEventListener('focus',renderSellerOptions);input.addEventListener('input',renderSellerOptions);document.addEventListener('click',event=>{if(!wrapper.contains(event.target)){menu.style.display='none';input.setAttribute('aria-expanded','false')}})}
function selectKpiSeller(seller){const input=document.getElementById('kpiSeller');input.value=seller;input.setAttribute('aria-expanded','false');const menu=input.parentElement.querySelector('.seller-options');menu.style.display='none';toast('Vendedor seleccionado: '+seller)}
function openAccessModal(action,userId){const selected=String(userId||'').split(',').map(id=>users.find(row=>row[0]===id)).filter(Boolean);const names=selected.map(user=>user[1]);if(!selected.length){toast('Selecciona al menos un usuario para continuar');return}if(action==='Eliminar usuario'){openDeleteWarning(selected.map(user=>user[0]).join(','),names.join(', '));return}document.getElementById('modal').innerHTML=`<div class="modal-head"><h2>${action}</h2><button class="close" aria-label="Salir del modal" title="Salir del modal" onclick="closeModal()">Esc</button></div><p class="panel-sub">La accion se aplicara a los usuarios seleccionados.</p><div class="field"><label>Usuarios seleccionados</label><input value="${names.join(', ')}" readonly></div><div class="notice">Esta accion requiere permisos de administrador y se aplicara a ${selected.length} usuario${selected.length===1?'':'s'}.</div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveModal('${action} ejecutado correctamente')">Confirmar</button></div>`;document.getElementById('modalBack').classList.remove('hidden')}
function openDeleteWarning(userId,userName){document.getElementById('modal').innerHTML=`<div class="modal-head"><h2>Advertencia de eliminacion</h2><button class="close" onclick="closeModal()">Cerrar</button></div><div class="notice" style="background:var(--red2);color:var(--red)"><strong>Esta accion es irreversible.</strong><br>Al eliminar los usuarios se perdera todo su historico, las loterias vendidas, los numeros ganadores y los demas datos relacionados. La informacion no podra recuperarse.</div><div class="field"><label>Usuarios que se eliminaran</label><input value="${userName}" readonly></div><p class="panel-sub">Revisa la informacion antes de continuar con la eliminacion.</p><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="danger" onclick="openDeleteConfirmation('${userId}','${userName}')">Continuar con la eliminacion</button></div>`;document.getElementById('modalBack').classList.remove('hidden')}
function openDeleteConfirmation(userId,userName){document.getElementById('modal').innerHTML=`<div class="modal-head"><h2>Confirmar eliminacion definitiva</h2><button class="close" onclick="closeModal()">Cerrar</button></div><p>Al eliminar el usuario se perdera absolutamente todo el historico perteneciente al usuario, las loterias vendidas, los numeros ganadores y sus datos relacionados. Esta accion ya no podra deshacerse.</p><div class="checklist"><label class="check"><input type="checkbox" checked disabled> Accesos y sesiones</label><label class="check"><input type="checkbox" checked disabled> Usuario y asociacion PDA</label><label class="check"><input type="checkbox" checked disabled> Ventas, boletos y juegos</label><label class="check"><input type="checkbox" checked disabled> Loterias vendidas y numeros ganadores</label><label class="check"><input type="checkbox" checked disabled> Demas informacion relacionada</label></div><div class="notice">Esta eliminacion no conserva auditoria historica, conforme al requisito aprobado.</div><div class="modal-actions"><button class="secondary" onclick="openDeleteWarning('${userId}','${userName}')">Volver</button><button class="danger" onclick="saveModal('Usuario y datos relacionados eliminados correctamente')">Si, eliminar usuario</button></div>`;document.getElementById('modalBack').classList.remove('hidden')}
function addHeaderControls(){const user=document.querySelector('.top-user');if(!document.getElementById('bell')){const bell=document.createElement('button');bell.id='bell';bell.className='bell';bell.setAttribute('aria-label','Ver notificaciones');bell.innerHTML='&#128276;<b>7</b>';bell.onclick=()=>showView(document.querySelector('[data-view=notificaciones]'));user.prepend(bell)}if(!document.querySelector('.nav [data-view=grupos]')){const groupButton=document.createElement('button');groupButton.dataset.view='grupos';groupButton.onclick=()=>showView(groupButton);groupButton.innerHTML='<i>▤</i><span>Grupos</span>';document.querySelector('.nav').insertBefore(groupButton,document.querySelector('.nav [data-view=pda]'))}}

ear PDA')">Desbloquear</button><button class="danger" onclick="openPdaBulkActionModal('Eliminar PDA')">Eliminar</button></div></div></div>`}

lass="secondary">Limpiar filtros</button></div></div><div class="panel"><div class="panel-head"><div><h2>Resumen por loteria</h2><div class="panel-sub">Boletos y valores registrados en el sistema</div></div></div>${lotteryTable(rows.slice((page-1)*5,page*5))}${pager(rows.length)}</div><div class="panel"><div class="panel-head"><div><h2>Buscar boletos vendidos</h2><div class="panel-sub">Consulta el ticket completo por cualquiera de los criterios disponibles.</div></div></div><div class="toolbar"><div class="field"><label>Codigo del boleto</label><input id="ticketCode" placeholder="AOL-4839201"></div><div class="field"><label>Numero jugado</label><input id="ticketNumber" placeholder="1234" inputmode="numeric"></div><div class="field"><label>Vendedor</label><input id="ticketSeller" placeholder="Nombre o alias"></div><div class="field"><label>Fecha</label><input id="ticketDate" type="date"></div><div class="field"><label>Estado</label><select id="ticketStatus"><option>Todos</option><option>Jugado</option><option>Ganador</option><option>Pagado</option><option>Vencido</option></select></div><button class="primary" onclick="searchLotteryTickets()">Buscar boletos</button><button class="secondary" onclick="clearLotteryTickets()">Limpiar</button></div><div id="lotteryTickets" style="margin-top:18px">${lotteryTicketResults(sales.slice(0,5))}</div></div>`}

ax})">Ultimo</button></div></div>`}

function supportView(){return head('Atencion directa','Soporte','Administra conversaciones con vendedores y observadores.')+`<style>.chat-shell{display:grid;grid-template-columns:290px minmax(0,1fr);height:620px;min-height:420px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}.chat-list{border-right:1px solid var(--line);background:#fbfdfc;overflow:auto}.chat-list-head{padding:18px;border-bottom:1px solid var(--line)}.chat-list-head h2{font-size:16px;margin:0 0 12px}.chat-search{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px}.chat-item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #edf1ef;background:transparent;padding:15px 18px;color:var(--ink)}.chat-item.active,.chat-item:hover{background:var(--green2)}.chat-person{display:flex;align-items:center;gap:10px}.chat-avatar{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:var(--gold);font-size:11px;font-weight:900}.chat-item strong{font-size:12px}.chat-item small{display:block;color:var(--muted);font-size:11px;margin:7px 0 0 42px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-dot{width:7px;height:7px;border-radius:50%;background:var(--green);margin-left:auto}.chat-window{display:grid;grid-template-rows:auto 1fr auto;min-width:0}.chat-head{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.chat-head h2{font-size:16px;margin:0}.chat-head p{font-size:11px;color:var(--muted);margin:4px 0 0}.chat-messages{padding:22px;overflow:auto;background:#f4f8f6;display:flex;flex-direction:column;gap:12px}.chat-message{max-width:min(78%,480px);padding:11px 14px;border-radius:12px;font-size:12px;line-height:1.45}.chat-message.other{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:3px}.chat-message.me{align-self:flex-end;background:#d8efe3;border:1px solid #b7dfc9;border-bottom-right-radius:3px}.chat-message time{display:block;color:var(--muted);font-size:10px;margin-top:6px;text-align:right}.chat-compose{padding:13px 16px;border-top:1px solid var(--line);display:flex;gap:8px;background:#fff}.chat-compose input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:11px}.chat-compose button{white-space:nowrap}@media(max-width:800px){.chat-shell{grid-template-columns:220px;height:680px}.chat-list-head{padding:14px}.chat-item{padding:13px 12px}.chat-message{max-width:88%}}@media(max-width:600px){.chat-shell{display:block;height:auto;overflow:visible}.chat-list{max-height:230px;border-right:0;border-bottom:1px solid var(--line)}.chat-window{height:500px}.chat-head{padding:14px}.chat-messages{padding:15px}.chat-compose{padding:10px}.chat-compose button{padding:10px}.heading{margin-bottom:17px}}</style><div class="chat-shell"><aside class="chat-list"><div class="chat-list-head"><h2>Conversaciones</h2><input class="chat-search" placeholder="Buscar chat" oninput="filterChats(this.value)"></div><button class="chat-item active" data-chat="camila" onclick="selectChat('camila',this)"><div class="chat-person"><span class="chat-avatar">CR</span><strong>Camila Rojas</strong><span class="chat-dot"></span></div><small>Necesito confirmar la impresion...</small></button><button class="chat-item" data-chat="andres" onclick="selectChat('andres',this)"><div class="chat-person"><span class="chat-avatar" style="background:var(--blue2)">AP</span><strong>Andres Perez</strong></div><small>El caso de premio ya esta asignado.</small></button><button class="chat-item" data-chat="nora" onclick="selectChat('nora',this)"><div class="chat-person"><span class="chat-avatar" style="background:var(--green2)">NC</span><strong>Nora Castro</strong><span class="chat-dot"></span></div><small>Envio una imagen del boleto.</small></button></aside><section class="chat-window"><header class="chat-head"><div><h2 id="chatName">Camila Rojas</h2><p id="chatRole">Vendedor · Conversacion de soporte</p></div><button class="secondary" onclick="toast('Conversacion marcada como atendida')">Marcar atendida</button></header><div class="chat-messages" id="chatMessages"><div class="chat-message other">Buenas tardes, tengo una duda con la impresion del boleto AOL-4839201.<time>14:18 · Camila Rojas</time></div><div class="chat-message me">Buenas tardes, Camila. La venta esta registrada. Voy a revisar el estado de la impresora.<time>14:20 · Administrador</time></div><div class="chat-message other">Gracias. Tambien puedo generar el PDF de contingencia?<time>14:22 · Camila Rojas</time></div></div><form class="chat-compose" onsubmit="sendChat(event)"><input id="chatInput" placeholder="Escribe un mensaje" autocomplete="off"><button class="primary">Enviar</button><button type="button" class="secondary" onclick="toast('Selector de archivos simulado')">Adjuntar</button></form></section></div>`}
function selectChat(chat,button){document.querySelectorAll('.chat-item').forEach(item=>item.classList.remove('active'));button.classList.add('active');const info={camila:['Camila Rojas','Vendedor'],andres:['Andres Perez','Observador'],nora:['Nora Castro','Vendedor']}[chat];document.getElementById('chatName').textContent=info[0];document.getElementById('chatRole').textContent=info[1]+' · Conversacion de soporte';document.getElementById('chatMessages').innerHTML=`<div class="chat-message other">Hola, administrador. Esta es la conversacion activa de ${info[0]}.<time>14:18 · ${info[0]}</time></div><div class="chat-message me">Recibido. Estoy revisando tu solicitud.<time>14:20 · Administrador</time></div>`}

function saveLotteryCatalog(index){const name=document.getElementById('catalogName').value.trim(),city=document.getElementById('catalogCity').value.trim();if(!name||!city){toast('Nombre y ciudad son obligatorios');return}if(index===null)lotteryCatalog.push({name,city,status:'Activo'});else Object.assign(lotteryCatalog[index],{name,city});closeModal();toast('Loteria guardada correctamente');render()}

function openModal(type,value=''){const m=document.getElementById('modal');let body={usuario:`<h2>Crear usuario</h2><p class="panel-sub">El vendedor debe tener un grupo y PDA asociado.</p><div class="field"><label>Nombre completo</label><input placeholder="Nombre y apellido"></div><div class="field"><label>Rol</label><select><option>Vendedor</option><option>Observador</option></select></div><div class="field"><label>Grupo</label><select><option>Buscar un grupo</option><option>Grupo Norte</option><option>Grupo Centro</option></select></div><div class="field"><label>PDA</label><select><option>Buscar un PDA</option><option>PDA-042</option><option>PDA-017</option></select></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveModal('Usuario creado correctamente')">Crear usuario</button></div>`,pda:`<h2>Registrar PDA</h2><div class="field"><label>Identificador del dispositivo</label><input placeholder="PDA-000"></div><div class="field"><label>Usuario asociado</label><select><option>Buscar un usuario</option><option>Camila Rojas</option><option>Jorge Mena</option></select></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveModal('PDA registrado correctamente')">Guardar PDA</button></div>`,loteria:`<h2>Nueva loteria</h2><div class="field"><label>Nombre</label><input placeholder="Nombre de la loteria"></div><div class="field"><label>Ciudad</label><input placeholder="Ciudad"></div><div class="field"><label>Hora de cierre</label><input type="time" value="20:00"></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveModal('Loteria creada correctamente')">Guardar loteria</button></div>`,resultado:`<h2>Registrar numero ganador</h2><div class="field"><label>Loteria</label><input placeholder="Buscar una loteria"></div><div class="field"><label>Fecha de juego</label><input type="date" value="2026-08-30"></div><div class="field"><label>Numero ganador</label><input placeholder="Ejemplo: 1234" inputmode="numeric"></div><div class="notice">La combinacion fecha de juego mas loteria debe ser unica.</div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveModal('Resultado registrado correctamente')">Guardar resultado</button></div>`,offline:`<h2>Generar codigos offline</h2><div class="field"><label>Vendedor</label><input placeholder="Buscar un vendedor"></div><div class="field"><label>PDA destino</label><input placeholder="Buscar un PDA"></div><div class="field"><label>Cantidad</label><input type="number" value="100" min="1"></div><div class="notice">Cada codigo tendra payload cifrado, consecutivo unico y trazabilidad.</div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveModal('Codigos generados y asignados')">Generar codigos</button></div>`,caso:`<h2>Validar caso ganador</h2><div class="notice">Ticket AOL-4839190 · Laura Gil · Estado Reportado</div><div class="checklist"><label class="check"><input type="checkbox"> Fotografia del ticket con QR visible recibida</label><label class="check"><input type="checkbox"> QR legible y corresponde al ticket</label><label class="check"><input type="checkbox"> Datos del ticket verificados</label></div><div class="modal-actions"><button class="danger" onclick="saveModal('Caso rechazado')">Rechazar caso</button><button class="primary" onclick="saveModal('Caso validado. Ahora puede asignar observador')">Validar caso</button></div>`,chat:`<h2>Chat con ${value}</h2><div class="notice">Conversacion directa con el administrador. Los adjuntos originales permanecen en el dispositivo.</div><div style="margin:18px 0;padding:13px;background:var(--paper);border-radius:8px;font-size:12px">Soporte: Buenas tardes, recibimos tu solicitud. Estamos revisando el boleto.</div><div class="field"><label>Mensaje</label><textarea style="min-height:90px;width:100%;border:1px solid var(--line);border-radius:8px;padding:10px" placeholder="Escribe un mensaje"></textarea></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cerrar</button><button class="primary" onclick="saveModal('Mensaje enviado')">Enviar mensaje</button></div>`,detalle:`<h2>Detalle del registro</h2><div class="details" style="display:grid;gap:10px;margin-top:18px"><div class="notice">Codigo: AOL-4839201</div><div class="notice">Vendedor: Camila Rojas</div><div class="notice">Estado: Jugado · Total: $45.000</div><div class="notice">La tirilla y el QR se visualizarian aqui.</div></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">Cerrar</button></div>`}[type]||'';m.innerHTML=`<div class="modal-head">${body.split('</h2>')[0]}</h2><button class="close" onclick="closeModal()">Cerrar</button></div>${body.substring(body.indexOf('</h2>')+5)}`;document.getElementById('modalBack').classList.remove('hidden')}
function closeModal(e){if(!e||e.target.id==='modalBack')document.getElementById('modalBack').classList.add('hidden')}
function saveModal(message){closeModal();toast(message)}function toast(message){const n=document.createElement('div');n.textContent=message;n.style='position:fixed;right:18px;bottom:20px;z-index:10;background:#173b35;color:#fff;padding:13px 16px;border-radius:8px;font-size:12px;box-shadow:var(--shadow)';document.body.appendChild(n);setTimeout(()=>n.remove(),2600)}function searchTable(input){document.querySelectorAll('tbody tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(input.value.toLowerCase())?'':'none')}
